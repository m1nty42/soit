<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>

    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <title>Faculty Directory</title>
</head>
<body>

<div class="container">
<h4>School of IT Faculty Directory</h4>
<hr>
    <table class="table table-bordered">
    <thead>
    <tr class="bg-success">
        <th>First Name</th>
        <th>Last Name</th>
        <th>Title</th>
        <th>Email</th>

    </tr>
    </thead>

    <tbody>
    <tr th:each="theFaculty : ${faculties}">
        <td th:text="${theFaculty.firstname}"></td>
        <td th:text="${theFaculty.lastname}"></td>
        <td th:text="${theFaculty.title}"></td>
        <td th:text="${theFaculty.email}"></td>
    </tr>
    </tbody>
</table>
</div>


</body>
</html>
